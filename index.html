<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lime Ricki — Summer Fun</title>
<meta name="description" content="A 30-second hand-drawn collage animation for Lime Ricki full-coverage swimwear. Pure JavaScript: canvas visuals and a synthesized soundtrack.">
<style>
  :root {
    --ink: #1d1a2b;
    --paper: #fbf3e3;
    --lime: #9bcb3c;
    --coral: #ff6b57;
    --muted: #b9b2a5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .stage { width: min(100vw - 32px, (100vh - 120px) * 16 / 9); max-width: 1920px; }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #f3e6c8; box-shadow: 0 30px 80px rgba(0,0,0,.45); }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(29,26,43,.28); transition: opacity .3s; }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .play-big { width: 118px; height: 118px; border-radius: 50%; border: 5px solid var(--ink); background: var(--coral); color: #fff; cursor: pointer; display: grid; place-items: center; box-shadow: 0 8px 0 var(--ink), 0 18px 40px rgba(0,0,0,.35); transform: rotate(-4deg); transition: transform .15s; }
  .play-big:hover { transform: rotate(0) scale(1.05); }
  .play-big:active { transform: translateY(4px); box-shadow: 0 4px 0 var(--ink); }
  .play-big svg { width: 48px; height: 48px; margin-left: 8px; }
  .hint { background: var(--paper); color: var(--ink); padding: 6px 14px; border-radius: 999px; font-weight: 600; box-shadow: 0 3px 0 var(--ink); }
  .bar { display: flex; align-items: center; gap: 12px; margin-top: 14px; }
  .btn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--paper); color: var(--ink); cursor: pointer; display: grid; place-items: center; }
  .btn:hover { background: var(--lime); }
  .btn svg { width: 18px; height: 18px; }
  .scrub { flex: 1; accent-color: var(--lime); height: 4px; cursor: pointer; }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 92px; text-align: right; }
  .credit { margin-top: 10px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .credit b { color: var(--paper); font-weight: 600; }
  body.export { background: #000; }
  body.export .stage { width: 1920px; max-width: none; }
  body.export .frame { border-radius: 0; box-shadow: none; }
  body.export .overlay, body.export .bar, body.export .credit { display: none; }
</style>
</head>
<body>
<main class="stage">
  <div class="frame">
    <canvas id="film" width="1920" height="1080" aria-label="Lime Ricki summer fun animation"></canvas>
    <div class="overlay" id="overlay">
      <button class="play-big" id="bigPlay" aria-label="Play with sound">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8z"/></svg>
      </button>
      <div class="hint" id="hint">Loading…</div>
    </div>
  </div>
  <div class="bar">
    <button class="btn" id="playBtn" aria-label="Play / pause"><svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M6 4l15 8-15 8z"/></svg></button>
    <button class="btn" id="restartBtn" aria-label="Restart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    <input class="scrub" id="scrub" type="range" min="0" max="30" step="0.01" value="0" aria-label="Seek">
    <span class="time" id="time">0:00.0 / 0:30</span>
    <button class="btn" id="muteBtn" aria-label="Mute"><svg viewBox="0 0 24 24" fill="currentColor" id="muteIcon"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </div>
  <div class="credit"><span><b>Lime Ricki</b> · Summer Fun · 0:30</span><span>Space play/pause · R restart · M mute · ←/→ seek</span></div>
</main>

<script src="src/core.js"></script>
<script src="src/brand.js"></script>
<script src="src/fonts.js"></script>
<script src="src/draw.js"></script>
<script src="src/patterns.js"></script>
<script src="src/text.js"></script>
<script src="src/figure.js"></script>
<script src="src/props.js"></script>
<script src="src/cast.js"></script>
<script src="src/film.js"></script>
<script src="src/scenes/intro.js"></script>
<script src="src/scenes/pool.js"></script>
<script src="src/scenes/beach.js"></script>
<script src="src/scenes/backyard.js"></script>
<script src="src/scenes/mixmatch.js"></script>
<script src="src/scenes/endcard.js"></script>
<script src="src/audio.js"></script>
<script src="src/main.js"></script>
</body>
</html>
